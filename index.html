  if(t.dataset.p){var p2=prod(t.dataset.p);setQty(t.dataset.p,(cart[t.dataset.p]||0)+step(p2));saveCust();draw();return}

  if(t.dataset.go){saveCust();var nv=t.dataset.go;if(nv==='home'){try{history.pushState(null,'',location.pathname)}catch(x){}}else if(nv==='shop'&&view==='home'){try{history.pushState(null,'','#boutique')}catch(x){}}view=nv;draw();window.scrollTo(0,0);if(view==='track'&&trackRef)trackLoad(trackRef);return}
  if(t.id==='send')send();
  if(t.id==='print')window.print();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){q=t.value;draw();return}
  if(t.dataset&&t.dataset.q){setQty(t.dataset.q,num(t.value));updTotals();var bar=$('.bar');if(bar){bar.className='bar '+(count()?'on':'');bar.querySelector('strong').textContent=count()+' produit'+(count()>1?'s':'');bar.querySelector('.in div div').textContent=money(total())}return}
  if(t.id==='c-mode'){$('#c-adrw').className=t.value==='livraison'?'':'hide';updTotals()}
  if(t.id==='c-zone')updTotals();
  if(/^c-/.test(t.id))saveCust();
});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.q){draw()}});



var trackRef='',trackRes=null;
var STEPS=['Nouvelle','En préparation','Prête','Livrée'];
function stepLabel(i,mode){return [['Commande reçue','La boutique a bien reçu votre commande'],['En préparation','Vos produits sont préparés'],[mode==='livraison'?'Prête, en route vers vous':'Prête à retirer','Contactez la boutique si besoin'],[mode==='livraison'?'Livrée':'Retirée','Merci de votre confiance !']][i]}
function demoSt(ref){try{var m=JSON.parse(localStorage.getItem('bq-demo-st')||'{}');return m[ref]||0}catch(e){return 0}}
function trackHTML(){
  var r=trackRes;if(!r)return '';
  if(r.notfound)return '<div class="err">Aucune commande trouvée avec ce numéro. Vérifiez-le (il figure sur votre facture).</div>';
  if(r.wait)return '<div class="ok"><strong>Commande envoyée ✔</strong><br>La boutique n’a pas encore ouvert votre commande. Revenez dans quelques minutes : cette page se met à jour toute seule.</div>';
  if(r.s==='Annulée')return '<div class="err"><strong>Commande annulée</strong><br>Contactez la boutique pour plus d’informations.</div>';
  var cur=Math.max(0,STEPS.indexOf(r.s));
  return '<ol class="steps">'+STEPS.map(function(x,i){var l=stepLabel(i,r.mode);return '<li class="'+(i<cur||(i===cur&&cur===3)?'done':i===cur?'now':'')+'"><span class="dot">'+(i<cur||(i===cur&&cur===3)?'✓':i+1)+'</span><span><strong>'+esc(l[0])+'</strong><br><span class="muted">'+esc(l[1])+'</span></span></li>'}).join('')+'</ol>'+(r.liv?'<p class="muted">Date souhaitée : '+esc(r.liv)+'</p>':'')+(r.t?'<p class="muted">Mis à jour à '+new Date(r.t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</p>':'')+(LIVE?'':'<button class="btn ghost sm" id="t-sim">Simuler l’étape suivante (démo)</button>');
}
function track(){
  var mine=getMine();
  var h=header()+'<div class="wrap"><h2>Suivre ma commande</h2><label>Numéro de commande<input id="t-ref" autocomplete="off" autocapitalize="characters" placeholder="Ex. CW20261022-AB12" value="'+esc(trackRef)+'"></label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn" id="t-go">Voir l’état</button><button class="btn ghost" data-go="shop">Retour aux produits</button></div>';
  if(mine.length)h+='<p class="muted" style="margin-top:16px">Mes commandes sur cet appareil</p><div class="chips">'+mine.map(function(m){return '<button class="chip '+(m.ref===trackRef?'on':'')+'" data-tref="'+esc(m.ref)+'">'+esc(m.ref)+'</button>'}).join('')+'</div>';
  return h+'<div id="t-res" style="margin-top:12px">'+trackHTML()+'</div></div>';
}
async function trackLoad(ref,silent){
  ref=String(ref||'').trim().toUpperCase();if(!ref)return;trackRef=ref;
  var mineHas=getMine().some(function(m){return m.ref===ref});
  try{
    if(LIVE){var rows=await rest('GET','catalogue?id=eq.st-'+encodeURIComponent(ref)+'&select=body');
      if(rows.length&&rows[0].body)trackRes={ref:ref,s:rows[0].body.s,mode:rows[0].body.mode,t:rows[0].body.t,liv:rows[0].body.liv};
      else trackRes=mineHas?{ref:ref,wait:true}:{ref:ref,notfound:true}}
    else{var o=JSON.parse(localStorage.getItem('bq-demo-orders')||'[]').find(function(x){return x.ref===ref});
      trackRes=o?{ref:ref,s:STEPS[demoSt(ref)],mode:o.mode,t:Date.now(),liv:o.liv}:{ref:ref,notfound:true}}
  }catch(e){if(!silent)trackRes={ref:ref,notfound:false,wait:mineHas};}
  var el=$('#t-res');if(el)el.innerHTML=trackHTML();
}
setInterval(function(){if(view==='track'&&trackRef&&!document.hidden)trackLoad(trackRef,true)},20000);
/* ---- visionneuse photo : zoom, déplacement, rotation ---- */
var lb={id:null,s:1,r:0,x:0,y:0},ptr={},pinch0=null;
function lbEl(){var e=document.getElementById('lb');if(!e){e=document.createElement('div');e.id='lb';e.setAttribute('role','dialog');e.setAttribute('aria-modal','true');document.body.appendChild(e);
  e.addEventListener('click',function(ev){var b=ev.target.closest('[data-lb]');if(!b)return;var a=b.dataset.lb;
    if(a==='close')closeLB();else if(a==='in')lbSet({s:lb.s*1.4});else if(a==='out')lbSet({s:lb.s/1.4});else if(a==='rl')lbSet({r:lb.r-90});else if(a==='rr')lbSet({r:lb.r+90});else if(a==='reset')lbSet({s:1,r:0,x:0,y:0});
    else if(a==='add'){var p=prod(lb.id);if(p){setQty(p.id,(cart[p.id]||0)+step(p));closeLB();draw()}}});
  e.addEventListener('input',function(ev){if(ev.target.id==='lb-rot')lbSet({r:+ev.target.value})});
  var st=function(){return e.querySelector('.stage')};
  e.addEventListener('wheel',function(ev){if(!ev.target.closest('.lcol'))return;ev.preventDefault();lbSet({s:lb.s*(ev.deltaY<0?1.15:1/1.15)})},{passive:false});
  e.addEventListener('dblclick',function(ev){if(ev.target.tagName==='IMG')lbSet(lb.s>1.2?{s:1,x:0,y:0}:{s:2.5})});
  e.addEventListener('pointerdown',function(ev){if(!ev.target.closest('.stage'))return;ptr[ev.pointerId]={x:ev.clientX,y:ev.clientY};try{ev.target.setPointerCapture(ev.pointerId)}catch(x){}pinch0=null});
  e.addEventListener('pointermove',function(ev){var o=ptr[ev.pointerId];if(!o)return;var ids=Object.keys(ptr);
    if(ids.length===1){lbSet({x:lb.x+ev.clientX-o.x,y:lb.y+ev.clientY-o.y})}
    else if(ids.length===2){ptr[ev.pointerId]={x:ev.clientX,y:ev.clientY};var a=ptr[ids[0]],b=ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      if(pinch0){lbSet({s:lb.s*d/pinch0.d,r:lb.r+(ang-pinch0.a)})}pinch0={d:d,a:ang};return}
    ptr[ev.pointerId]={x:ev.clientX,y:ev.clientY}});
  var up=function(ev){delete ptr[ev.pointerId];pinch0=null};e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);
  document.addEventListener('keydown',function(ev){if(!lb.id)return;if(ev.key==='Escape')closeLB();else if(ev.key==='+'||ev.key==='=')lbSet({s:lb.s*1.4});else if(ev.key==='-')lbSet({s:lb.s/1.4});else if(ev.key==='r'||ev.key==='R')lbSet({r:lb.r+90})});
 }return e}
function lbSet(o){for(var k in o)lb[k]=o[k];lb.s=Math.max(.5,Math.min(8,lb.s));if(lb.s<=1.01&&!('x' in o)){lb.x*=.5;lb.y*=.5}
  var e=document.getElementById('lb'),im=e&&e.querySelector('img');if(im)im.style.transform='translate('+lb.x+'px,'+lb.y+'px) scale('+lb.s+') rotate('+lb.r+'deg)';
  var rg=document.getElementById('lb-rot');if(rg){var v=((lb.r%360)+360)%360;rg.value=v}}
function openLB(id){var p=prod(id);if(!p)return;lb={id:id,s:1,r:0,x:0,y:0};ptr={};
  var e=lbEl(),out=!(p.stock>0),cur=cart[p.id]||0,b=(cat&&cat.boutique)||{};
  var left=p.photo?'<div class="stage"><img src="'+esc(p.photo)+'" alt="'+esc(p.nom)+'" draggable="false"></div><div class="bot"><button data-lb="out" aria-label="Zoom moins">−</button><button data-lb="in" aria-label="Zoom plus">+</button><button data-lb="rl" aria-label="Tourner à gauche">⟲</button><button data-lb="rr" aria-label="Tourner à droite">⟳</button><input id="lb-rot" type="range" min="0" max="359" value="0" aria-label="Faire tourner la photo"><button data-lb="reset">Remettre</button><div class="hint">Pincez ou molette pour zoomer · glissez pour déplacer · double-touchez pour agrandir</div></div>':'<div class="stage nophoto"><div class="nobig">'+catIcon(p.cat)+'</div></div>';
  var panel='<aside class="lpanel">'+(p.cat?'<div class="lcat">'+esc(p.cat)+'</div>':'')+'<h2>'+esc(p.nom)+'</h2><div class="lprice">'+money(p.prix)+' <small>/ '+esc(p.unite)+(p.fmt?' · '+esc(p.fmt):'')+'</small></div><div class="lstock '+(out?'out':'')+'">'+(out?'Indisponible pour le moment':'En stock')+'</div>'+(p.desc?'<p class="ldesc">'+esc(p.desc)+'</p>':'')+(out?'':'<button class="add" data-lb="add">Ajouter à ma commande</button>'+(cur?'<div class="muted">Déjà dans votre panier : '+qf(cur)+' '+esc(p.unite)+'</div>':''))+'</aside>';
  e.innerHTML='<div class="top"><span class="lbrand">'+esc(b.nom||'')+'</span><button data-lb="close" aria-label="Fermer">✕</button></div><div class="lbody"><div class="lcol">'+left+'</div>'+panel+'</div>';
  e.classList.add('on');document.body.style.overflow='hidden';lbSet({});if(p.hd&&LIVE)loadHD(id);var c=e.querySelector('[data-lb=close]');if(c)c.focus()}
var hdCache={};
async function loadHD(id){
  var set=function(u){var im=document.querySelector('#lb img');if(im&&lb.id===id){im.src=u;im.style.opacity=1}};
  if(hdCache[id])return set(hdCache[id]);
  var im0=document.querySelector('#lb img');if(im0)im0.style.opacity=.75;
  try{var rows=await rest('GET','catalogue?id=eq.ph-'+encodeURIComponent(id)+'&select=body');if(rows.length&&rows[0].body&&rows[0].body.img){hdCache[id]=rows[0].body.img;set(hdCache[id])}else if(im0)im0.style.opacity=1}catch(e){if(im0)im0.style.opacity=1}
}
function closeLB(){var e=document.getElementById('lb');if(e)e.classList.remove('on');lb.id=null;document.body.style.overflow=''}
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.dataset&&e.target.dataset.zoom){e.preventDefault();openLB(e.target.dataset.zoom)}});
var sm=location.search.match(/[?&]suivi=([^&]+)/);if(sm){view='track';trackRef=decodeURIComponent(sm[1]).toUpperCase()}else if(location.hash==='#boutique')view='shop';
window.addEventListener('popstate',function(){if(view==='home'||view==='shop'){view=location.hash==='#boutique'?'shop':'home';if(cat){closeLB();draw();window.scrollTo(0,0)}}});
document.addEventListener('keydown',function(e){var t=e.target;if(e.key==='Enter'&&t&&t.getAttribute&&t.getAttribute('role')==='link'&&t.dataset&&t.dataset.go)t.click()});
var DEMO=!LIVE&&!!(window.BOUTIQUE_DEMO||/[?&]demo=1/.test(location.search)||/^(localhost|127\.)/.test(location.hostname)||location.protocol==='file:');
if(!LIVE&&!DEMO){document.title='Niger Épices · Bientôt en ligne';document.getElementById('app').innerHTML='<div class="page"><div class="wrap" style="text-align:center;padding:60px 16px"><h1 style="font-size:34px;margin:0 0 10px">Niger Épices</h1><p style="font-size:18px">Notre boutique en ligne ouvre bientôt.</p><p class="muted">Épices, viandes séchées et saveurs du Sahel, à Bamako.</p></div></div>';return}
loadCart();loadCat().then(function(){if(cat){document.title=((cat.boutique||{}).nom||'Boutique')+' · Commander en ligne';Object.keys(cart).forEach(function(id){if(!prod(id))delete cart[id]})}draw();if(view==='track'&&trackRef)trackLoad(trackRef)});
})();
