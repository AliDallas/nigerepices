<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Niger Épices</title>
<meta name="theme-color" content="#1B1B1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Niger Épices">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: ink banner with bogolan band on top, sidebar nav + working column on desktop, bottom tab bar on phone. */
:root{
  --bg:#F3EDE2; --surface:#FFFDF8; --surface2:#EAE0CE; --fg:#201710; --muted:#6A5B4B; --line:#DBCEB8;
  --accent:#A8480F; --accent-fg:#FFFFFF; --green:#2C6B3B; --gold:#C98F0F; --bad:#B3261E; --ink:#1B1B1B; --on-ink:#F6ECDD;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:25px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.sp{flex:1}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 100px}
.hero{background:var(--ink);color:var(--on-ink);border-radius:16px;overflow:hidden}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--surface2)}
.mark{width:44px;height:44px;flex:none;border-radius:12px;background:var(--gold);display:grid;place-items:center;color:var(--ink);font:800 22px var(--font-display)}
.brand p{font-size:13px;opacity:.75;text-transform:capitalize}
.top-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chipu{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12)}
.chipu.ok{color:#8FE0A6}
.chipu.local{color:#F5C46B}
.hero .btn.ghost{color:var(--on-ink);border-color:rgba(255,255,255,.28)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.1)}
.band{display:block;width:100%;height:20px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;overflow-x:auto;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav button{flex:0 0 auto;min-width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--accent-fg);background:var(--accent)}
@media (min-width:920px){
  .shell{grid-template-columns:200px minmax(0,1fr);padding-bottom:40px;align-items:start}
  .hero{grid-column:1/-1}
  .nav{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));flex-direction:column;overflow:visible;border:1px solid var(--line);border-radius:14px;padding:8px;gap:2px;z-index:1}
  .nav button{flex-direction:row;gap:10px;min-width:0;font-size:14px;padding:10px 12px;width:100%;justify-content:flex-start}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:grid;gap:16px}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh-r{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.55}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn.lg{min-height:54px;font-size:16.5px;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1;color:var(--muted)}

.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit}
.in.qty{width:88px;text-align:right}
.in.pu{width:104px;text-align:right}
textarea.in{min-height:0;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--fg)}
.form{display:grid;gap:12px}
.form.g2{grid-template-columns:1fr}
@media (min-width:600px){.form.g2{grid-template-columns:1fr 1fr}.form .full{grid-column:1/-1}}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px;margin-block:12px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:13px 14px;display:grid;gap:2px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi strong{font:700 clamp(17px,5vw,21px)/1.2 var(--font-display);overflow-wrap:break-word}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.warn{border-top-color:var(--bad)}
.kpi.warn strong{color:var(--bad)}
.kpi.good{border-top-color:var(--green)}
.kpi.good strong{color:var(--green)}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.cols.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.cols.eq{grid-template-columns:repeat(2,minmax(0,1fr))}}

.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .muted{font-size:13px}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.low{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--fg)}
.badge.ok{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--green)}
.badge.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.new{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:54px;height:54px;border-radius:11px;object-fit:cover;flex:none;background:var(--surface2)}
.thumb.ph,.pimg.ph{display:grid;place-items:center;font:800 22px var(--font-display);color:var(--accent)}

.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.pos{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{display:grid;gap:6px;text-align:left;padding:8px 8px 11px;border-radius:13px;border:1px solid var(--line);background:var(--surface);min-width:0;align-content:start}
.pcard:hover:not([disabled]){border-color:var(--accent)}
.pcard[disabled]{opacity:.5;cursor:not-allowed}
.pimg{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;background:var(--surface2);display:block}
.pimg.ph{font-size:34px}
.pcard .pn{font-weight:700;overflow-wrap:anywhere;padding-inline:3px}
.pcard .pp{font:700 15px var(--font-display);color:var(--accent);padding-inline:3px}
.pcard .pp small{font:500 12px var(--font-body);color:var(--muted)}
.pcard .ps{font-size:12px;color:var(--muted);padding-inline:3px}
.pcard .ps.low{color:var(--bad);font-weight:600}

.cartwrap{display:none}
.cartwrap.open{display:block;position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cart{display:grid;gap:12px}
.cart-h{display:flex;align-items:center;justify-content:space-between}
.cline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cline .unit{font-size:13px;color:var(--muted);min-width:34px}
.totals{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.totals>div{display:flex;justify-content:space-between;gap:8px}
.totals .big{font:800 23px var(--font-display)}
#c-extra{color:var(--muted);font-size:13.5px;min-height:1em}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;min-height:52px;padding:0 20px;border-radius:99px;border:0;background:var(--gold);color:#1b1004;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.3)}
@media (min-width:920px){
  .cartwrap,.cartwrap.open{display:block;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));inset:auto;z-index:1;background:none;overflow:visible;padding:0}
  .closecart,.fab{display:none!important}
}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect{fill:var(--accent)}
.chart rect.hi{fill:var(--gold)}
.hbar{display:grid;gap:4px;padding:8px 0}
.hbar .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hbar .b{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--green);border-radius:4px}
.empty{display:grid;gap:10px;padding:20px;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.note{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 20%,transparent);font-size:13.5px}
pre.rc{margin:0;padding:12px;border-radius:10px;background:var(--surface2);font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.pre-prev{display:flex;align-items:center;gap:12px}
.pre-prev .thumb{width:84px;height:84px}

.ov{position:fixed;inset:0;z-index:60;background:rgba(10,6,3,.6);display:flex;align-items:flex-end;justify-content:center;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet{width:100%;max-width:600px;max-height:92vh;overflow:auto;background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;display:grid;gap:14px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:18px;padding:22px}}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:120;max-width:min(92vw,460px);padding:11px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
@media (min-width:920px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.4}}}

.fact{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.fbody{padding:14px;display:grid;gap:12px}
.fh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.flogo{width:48px;height:48px;border-radius:10px;object-fit:cover}
.fn{text-align:right;font-size:14px;display:grid;gap:2px}
.fn strong{font:800 18px var(--font-display);letter-spacing:.06em}
.fact .tbl table{min-width:0;font-size:13.5px}
.ftot{display:grid;gap:4px;margin-left:auto;min-width:min(260px,100%)}
.ftot>div{display:flex;justify-content:space-between;gap:12px}
.ftot .big{font:800 20px var(--font-display);padding-top:4px;border-top:2px solid var(--ink)}
.fpied{text-align:center;font-size:13px;color:var(--muted)}

.lock{position:fixed;inset:0;z-index:100;background:var(--ink);overflow:auto;display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lock-bg{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
.lock-card{position:relative;width:min(420px,100%);background:var(--surface);color:var(--fg);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.lock-in{padding:22px;display:grid;gap:14px;text-align:center}
.ubtn{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.ubtn:hover{border-color:var(--accent)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:800 18px var(--font-display);flex:none}
.dots{display:flex;gap:12px;justify-content:center;padding-block:4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent)}
.dots i.f{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font:700 24px var(--font-display)}
.pad button:active{background:var(--accent);color:var(--accent-fg)}
.pad button.fn2{font:600 14px var(--font-body);color:var(--muted)}
.lmsg{min-height:1.4em;color:var(--bad);font-weight:600;font-size:14px}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh}
.shell{padding-top:max(14px,env(safe-area-inset-top,0px))}
.ubtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
/* ===== Style 2 : Marché coloré ===== */
:root{--bg:#FFF6D6;--surface:#FFFFFF;--surface2:#FBEBB0;--fg:#1B1B1B;--muted:#5C5547;--line:#E4D79F;--accent:#C8102E;--accent-fg:#FFFFFF;--green:#0B7A3B;--gold:#E3A400;--bad:#B3001B;--ink:#1B1B1B;--on-ink:#FFF6D6;
  --font-display:'Rubik','Trebuchet MS',system-ui,sans-serif;--font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
body{font-weight:500}
h1{font-weight:900;letter-spacing:-.02em}h2{font-weight:900;letter-spacing:-.01em}h3{font-weight:700}
.shell{padding-bottom:120px}
.hero{border-radius:0 0 26px 26px;margin-inline:-16px;padding-inline:16px;padding-top:max(0px,env(safe-area-inset-top,0px));background:var(--ink)}
.hero .brand h1{color:#fff;font-size:24px}
.band{height:14px}
.mark{background:var(--gold);color:var(--ink);font-weight:900;border-radius:14px}
.chipu{background:rgba(255,255,255,.14);font-weight:600}
.btn{border-radius:999px;border:2px solid var(--accent);font-weight:700}
.btn.ghost{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:#fff}
.hero .btn.ghost{background:transparent;color:var(--on-ink);border-color:rgba(255,255,255,.4)}
.btn.lg{min-height:58px;font-size:17px}
.in{border:2px solid var(--ink);border-radius:14px;background:#fff}
.in:focus{outline:3px solid var(--gold);outline-offset:0}
.card{border:2px solid var(--ink);border-radius:22px;background:#fff}
.sheet{border-radius:26px 26px 0 0;border:2px solid var(--ink)}
@media (min-width:640px){.sheet{border-radius:26px}}
.seg{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{border-radius:999px;color:var(--ink)}
.seg button.on{background:var(--gold);color:var(--ink)}
.seg.big button{min-height:54px;font-size:18px;font-weight:800}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);font-weight:600}
.chip.on{background:var(--ink);color:var(--gold)}
.kpi{border:2px solid var(--ink);border-radius:22px;background:#fff}
.kpi.good{background:var(--green);color:#fff}.kpi.good .k,.kpi.good .s{color:#E6F6EC}.kpi.good strong{color:#fff}
.kpi.warn{background:var(--accent);color:#fff}.kpi.warn .k,.kpi.warn .s{color:#FFE3E7}.kpi.warn strong{color:#fff}
.kpi.gold{background:var(--gold)}.kpi.gold .k,.kpi.gold .s{color:#3A2C00}
.kpi strong{font-weight:900}
.bighero{background:var(--green);color:#fff;border:2px solid var(--ink);border-radius:28px;padding:20px 22px;display:grid;gap:6px;box-shadow:6px 6px 0 var(--ink)}
.bighero .k{font-size:14px;font-weight:600;opacity:.92}
.bighero .v{font:900 clamp(38px,11vw,60px)/1.05 var(--font-display);letter-spacing:-.02em}
.bighero .v small{font-size:.38em;font-weight:700;opacity:.9}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:12.5px;font-weight:700}
.pill.up{background:#fff;color:var(--green)}.pill.dn{background:#fff;color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--gold)}.dot.bad{background:var(--accent)}.dot.low{background:var(--gold)}
.alerts{border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.sec::after{background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 14px);opacity:.5}
.badge{font-weight:700}
.badge.low{background:var(--gold);color:var(--ink)}
.badge.ok{background:var(--green);color:#fff}
.badge.bad{background:var(--accent);color:#fff}
.badge.new{background:var(--ink);color:var(--gold)}
.thumb,.pimg{border-radius:14px}
.pcard{border:2px solid var(--ink);border-radius:22px;background:#fff}
.pcard:hover:not([disabled]){box-shadow:4px 4px 0 var(--gold);border-color:var(--ink)}
.pcard .pp{color:var(--accent);font-weight:900}
.favs{display:flex;gap:8px;overflow-x:auto;align-items:center;padding:12px 0 2px}
.favs .muted{flex:none;font-size:12.5px;font-weight:600}
.fav{flex:none;display:grid;text-align:left;padding:8px 14px;border-radius:16px;border:2px solid var(--ink);background:var(--gold);min-width:104px}
.fav b{font-weight:800;font-size:13.5px}.fav small{font-weight:600;font-size:12px}
.heldrow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 0 10px}
.chart rect{fill:var(--gold)}.chart rect.hi{fill:var(--ink)}
.hbar .b{background:#F3E6B8;height:10px;border-radius:6px}.hbar .b i{border-radius:6px}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-block:8px}
.donut{width:132px;height:132px;flex:none}
.legend{display:grid;gap:4px;font-size:13px}.legend span{display:flex;gap:8px;align-items:center}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);border:0;border-radius:999px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.nav button{color:#E8DFC4;border-radius:999px;font-weight:600}
.nav button.on{background:var(--gold);color:var(--ink)}
@media (min-width:920px){
  .shell{grid-template-columns:210px minmax(0,1fr)}
  .hero{margin-inline:0;border-radius:26px}
  .nav{left:auto;right:auto;bottom:auto;border-radius:26px;padding:10px;box-shadow:none}
  .nav button{border-radius:16px}
}
.fab{background:var(--gold);color:var(--ink);border:2px solid var(--ink);font-weight:800;bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.fact{border:2px solid var(--ink);border-radius:18px}
.lock-card{border:2px solid var(--ink);border-radius:26px}
.ubtn{border:2px solid var(--ink);border-radius:18px}.ubtn:hover{box-shadow:4px 4px 0 var(--gold)}
.ava{background:var(--accent)}

.clsum.ok{background:var(--green);color:#fff}.clsum.bad{background:var(--accent);color:#fff}.clsum.low{background:var(--gold);color:#1B1B1B}

async function flushSave(){
  clearTimeout(saveT);if(!idb)return;
  try{
    var photos={},st={reglages:reglages};
    COLS.forEach(function(c){st[c]=data[c]});
    st.produits=data.produits.map(function(p){if(p.photo){photos[p.id]=p.photo;var q=Object.assign({},p);delete q.photo;return q}return p});
    st.depenses=data.depenses.map(function(d){if(d.recu){photos['d'+d.id]=d.recu;var q=Object.assign({},d);delete q.recu;return q}return d});

}

function buildSnapshot(){
  var from=new Date();from.setDate(from.getDate()-150);var f=dstr(from),jours={};
  var J=function(d){return jours[d]||(jours[d]={ca:0,nb:0,mg:0,gros:0,esp:0,mm:0,cr:0,ret:0,per:0,ch:0})};
  var mk=today().slice(0,7),pd=new Date();pd.setDate(1);pd.setMonth(pd.getMonth()-1);var pk=dstr(pd).slice(0,7);
  var vend={},fam={},top={},depCur={},depPrev={};
  data.ventes.forEach(function(v){
    if(v.date>=f){var j=J(v.date);j.ca+=v.total;j.nb++;j.mg+=margeVente(v);if(v.type==='Gros')j.gros+=v.total;j.esp+=encEsp(v);j.mm+=encMM(v);j.cr+=dette(v)}
    if(v.date.slice(0,7)===mk){var n=v.vendeur||'—';vend[n]=(vend[n]||0)+v.total;v.lignes.forEach(function(l){var c=l.cat||'Autres';fam[c]=(fam[c]||0)+l.qte*l.prix;var t=top[l.nom]||(top[l.nom]={n:l.nom,q:0,u:l.unite,c:0});t.q+=l.qte;t.c+=l.qte*l.prix})}
  });
  data.mouvements.forEach(function(m){
    if(m.date<f)return;
    if(m.type==='retour'){var j=J(m.date);j.ret+=m.montant||0;j.mg+=-(m.montant||0)+(m.restock?m.qte*(m.cout||0):0)}
    else if(m.type==='perte'){var j2=J(m.date),v=m.qte*(m.cout||0);j2.per+=v;j2.mg-=v}
  });
  data.depenses.forEach(function(d){
    if(isStockExp(d))return;
    if(d.date>=f)J(d.date).ch+=d.montant;
    if(d.date.slice(0,7)===mk)depCur[d.cat]=(depCur[d.cat]||0)+d.montant;
    else if(d.date.slice(0,7)===pk)depPrev[d.cat]=(depPrev[d.cat]||0)+d.montant;
  });
  Object.keys(jours).forEach(function(k){var j=jours[k];for(var x in j)j[x]=Math.round(j[x])});
  var r0=function(o){var z={};Object.keys(o).forEach(function(k){z[k]=Math.round(o[k])});return z};
  return{v:1,at:Date.now(),nom:reglages.nom,jours:jours,
    produits:data.produits.map(function(p){return{n:p.nom,c:p.cat||'',u:p.unite,s:p.stock,a:p.seuil,r:p.cout||0,p:p.prix,g:p.prix_gros||0}}),
    dus:data.clients.map(function(c){return{n:c.nom,t:c.tel||'',du:Math.round(clientDu(c.id))}}).filter(function(c){return c.du>0}),
    last:data.ventes.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,40).map(function(v){return{n:v.numero||'',ts:v.ts,c:v.clientNom,v:v.vendeur||'',m:v.mode,t:v.type||'Détail',tot:v.total,pa:v.paye}}),
    mv:data.mouvements.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,25).map(function(m){return{ts:m.ts,ty:m.type,n:m.nom,q:m.qte,u:m.unite||'',mo:m.motif||'',us:m.user||''}}),
    vend:r0(vend),fam:r0(fam),dep:{cur:r0(depCur),prev:r0(depPrev)},
    top:Object.keys(top).map(function(k){var t=top[k];return{n:t.n,q:Math.round(t.q*100)/100,u:t.u,c:Math.round(t.c)}}).sort(function(a,b){return b.c-a.c}).slice(0,8)};
}

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 115 '+(h+12)+'" class="bcsvg"><rect width="115" height="'+(h+12)+'" fill="#fff"/><g fill="#000">'+out+'</g><text x="57.5" y="'+(h+10)+'" font-size="9" text-anchor="middle" font-family="monospace" fill="#000">'+code[0]+' '+code.slice(1,7)+' '+code.slice(7)+'</text></svg>';

  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:title||name}).catch(function(){});return}
  downloadBlob(name,blob);toast('PDF enregistré');
}

async function saveInventaire(){
  var n=0,perte=0,els=document.querySelectorAll('[data-inv]');
  for(var i=0;i<els.length;i++){
    var raw=els[i].value;if(raw==='')continue;var p=pById(els[i].dataset.inv);if(!p)continue;
    var q=num(raw),d=r3(q-p.stock);if(d===0)continue;
    await S.patch('produits',p.id,{stock:q});
    await addMv({type:'ajustement',pid:p.id,nom:p.nom,unite:p.unite,qte:d,cout:p.cout||0,motif:'Inventaire'});
    n++;if(d<0)perte+=-d*(p.cout||0);
  }
  logAct('Inventaire',n+' écart'+(n>1?'s':'')+(perte>0?' · manque valorisé '+money(perte):''));
  closeModal();toast(n?n+' écart'+(n>1?'s':'')+' corrigé'+(n>1?'s':'')+(perte>0?' · manque : '+money(perte):''):'Aucun écart : le stock est exact');
}

function vendStats(vs){

  return Object.keys(o).map(function(k){return o[k]}).sort(function(a,b){return b.ca-a.ca});
}
function topProds(vs,n){
  var agg={};vs.forEach(function(v){v.lignes.forEach(function(l){var x=agg[l.nom]||(agg[l.nom]={n:l.nom,q:0,c:0,m:0,u:l.unite});x.q+=l.qte;x.c+=l.qte*l.prix;x.m+=l.qte*(l.prix-(l.cout||0))})});
  return Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return b.c-a.c}).slice(0,n);
}

function cutout(im){
  if(im.dataset.c)return;im.dataset.c='1';
  try{var w=im.naturalWidth,h=im.naturalHeight;if(!w||!h){im.classList.add('ok');return}
  var m0=Math.min(1,320/Math.max(w,h));w=Math.round(w*m0);h=Math.round(h*m0);
  var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
  var d=x.getImageData(0,0,w,h),a=d.data,seen=new Uint8Array(w*h),st=[],i;
  function add(k){if(!seen[k]&&Math.min(a[k*4],a[k*4+1],a[k*4+2])>226){seen[k]=1;st.push(k)}}
  for(i=0;i<w;i++){add(i);add((h-1)*w+i)}for(i=0;i<h;i++){add(i*w);add(i*w+w-1)}
  while(st.length){var k=st.pop(),px=k%w,py=(k/w)|0;if(px>0)add(k-1);if(px<w-1)add(k+1);if(py>0)add(k-w);if(py<h-1)add(k+w)}
  for(i=0;i<w*h;i++){if(seen[i])a[i*4+3]=0}
  for(var yy=1;yy<h-1;yy++)for(var xx=1;xx<w-1;xx++){var q=yy*w+xx;if(seen[q])continue;if(seen[q-1]||seen[q+1]||seen[q-w]||seen[q+w]){var m=Math.min(a[q*4],a[q*4+1],a[q*4+2]);if(m>190)a[q*4+3]=Math.max(40,Math.round(255-(m-190)/36*215))}}
  x.putImageData(d,0,0);im.src=c.toDataURL('image/png')}catch(e){}
  im.classList.add('ok')}

function seqNext(prefix){
  var y=new Date().getFullYear(),tg=SYNC.tag||'',key=prefix+y+(tg?'-'+tg:''),re=new RegExp('^'+key+'-(\\d+)$'),mx=0;
  (prefix==='F'?data.ventes.map(function(v){return v.numero}):prefix==='FF'?data.achats.map(function(v){return v.numero}):prefix==='PF'?achatPays().map(function(p){return p.recu}):allPays().map(function(p){return p.recu})).forEach(function(n){var m=re.exec(n||'');if(m)mx=Math.max(mx,+m[1])});
  var st=reglages.seq||{},nx=Math.max(mx,st[key]||0)+1,o={};o[key]=nx;reglages.seq=Object.assign({},st,o);

}

function fournRows(){
  var m={};data.fournisseurs.forEach(function(f){m[f.id]={f:f,A:[]}});

async function createSale(o){
  var sub=sumBy(o.lignes,function(l){return l.qte*l.prix});
  var total=Math.max(0,Math.round(sub-(o.remise||0)));
  var paye=o.mode==='Crédit'?Math.min(total,Math.max(0,o.recu||0)):total;
  var pMM=o.mode==='Mixte'?Math.min(total,Math.max(0,o.mm||0)):0;
  var c=cById(o.clientId);
  var sale={id:uid(),numero:nextNumero(),ts:Date.now(),date:today(),type:o.type||'Détail',lignes:o.lignes,remise:o.remise||0,sous_total:sub,total:total,mode:o.mode,paye:paye,clientId:o.clientId||'',clientNom:c?c.nom:'Client de passage',source:o.source||'caisse',vendeur:session?session.nom:'',vendeurId:session?session.id:''};
  if(o.mode==='Mixte'){sale.pMM=pMM;sale.pEsp=total-pMM}
  if(o.mode==='Espèces'){sale.remis=o.recu>0?Math.max(o.recu,total):total;sale.rendu=sale.remis-total}
  if(paye>0)sale.paiements=[{id:uid(),date:today(),montant:paye,mode:o.mode==='Crédit'?'Espèces':o.mode,note:o.mode==='Crédit'?'Versement à la vente':'',recu:o.mode==='Crédit'?seqNext('R'):'',by:session?session.nom:''}];
  await S.put('ventes',sale);
  for(var i=0;i<o.lignes.length;i++){var l=o.lignes[i],p=pById(l.pid);if(p)await S.patch('produits',p.id,{stock:r3(p.stock-l.qte)})}
  return sale;
}
function stockProblem(lignes){
  for(var i=0;i<lignes.length;i++){var l=lignes[i],p=pById(l.pid);if(l.svc)continue;if(!p)return 'Produit introuvable : '+l.nom;if(l.qte<=0)return 'Quantité à corriger pour '+p.nom;if(l.qte>p.stock)return 'Stock insuffisant pour '+p.nom+' (reste '+qf(p.stock)+' '+p.unite+')'}
  return '';
}
async function valider(auth){
  var t=cartTotals();if(!t.L.length)return toast('Le panier est vide','bad');
  var lignes=t.L.map(function(l){return{pid:l.p.id,nom:l.p.nom,cat:l.p.cat||'',qte:l.qte,unite:l.p.unite,prix:l.pu,cout:l.p.cout||0}});
  var pb=stockProblem(lignes);if(pb)return toast(pb,'bad');
  var rm=reglages.remiseMax;if(rm==null||rm==='')rm=10;
  if(!isAdmin()&&ui.remise>0&&ui.remise>t.sub*rm/100&&!auth){
    if(reglages.codeRemise===false)return toast('Remise limitée à '+rm+' % du panier pour la caisse. Demandez à l’administrateur.','bad');
    return patronModal('Remise de '+money(ui.remise)+' sur un ticket de '+money(t.sub)+' (limite de la caisse : '+rm+' %)',function(by){valider(by)});
  }
  if(ui.mode==='Crédit'&&!ui.clientId)return toast('Choisissez un client pour une vente à crédit','bad');
  var cl=cById(ui.clientId);
  if(cl&&cl.plafond>0&&!isAdmin()){var reste=ui.mode==='Crédit'?Math.max(0,t.total-ui.recu):0;if(reste>0&&clientDu(cl.id)+reste>cl.plafond)return toast('Plafond de crédit dépassé pour '+cl.nom+' ('+money(cl.plafond)+')','bad')}
  if(ui.mode==='Mixte'&&ui.mm>t.total)return toast('Le mobile money dépasse le total','bad');
  if(ui.mode==='Espèces'&&ui.recu>0&&ui.recu<t.total)return toast('Le montant remis ('+money(ui.recu)+') est inférieur au total','bad');
  var sale=await createSale({lignes:lignes,remise:ui.remise,mode:ui.mode,recu:ui.recu,mm:ui.mm,clientId:ui.clientId,type:ui.vtype});
  if(ui.remise>0){logAct('Remise accordée',money(ui.remise)+' · vente '+sale.numero);ctl('remise','Remise sur la facture '+sale.numero+' ('+sale.clientNom+')',ui.remise,{ref:sale.id,auth:auth||''})}
  ui.cart=[];ui.remise=0;ui.recu=0;ui.mm=0;ui.cartOpen=false;ui.clientId='';ui.vtype='Détail';render();showFacture(sale);
}
function factureText(s){
  var L=['*'+(reglages.nom||'Niger Épices')+'*'];
  if(reglages.adresse)L.push(reglages.adresse);
  if(reglages.tel)L.push('Tél : '+reglages.tel);if(reglages.nif)L.push('NIF : '+reglages.nif);if(reglages.rccm)L.push('RCCM : '+reglages.rccm);
  L.push('FACTURE N° '+(s.numero||''),new Date(s.ts).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}),'Client : '+s.clientNom,'');
  s.lignes.forEach(function(l){L.push(l.nom+' · '+qf(l.qte)+' '+l.unite+' × '+money(l.prix)+' = '+money(l.qte*l.prix))});
  if(s.remise>0)L.push('Remise : -'+money(s.remise));
  L.push('','*TOTAL : '+money(s.total)+'*','Paiement : '+s.mode);
  if(pays(s).length>1)pays(s).forEach(function(p,i){L.push('Paiement '+(i+1)+' ('+fdstr(p.date)+') : '+money(p.montant))});
  if(s.rendu>0)L.push('Remis : '+money(s.remis),'Monnaie rendue : '+money(s.rendu));
  if(s.paye<s.total||s.mode==='Crédit')L.push('Déjà payé : '+money(s.paye),'Reste à payer : '+money(dette(s)));
  if(reglages.pied)L.push('',reglages.pied);
  return L.join('\n');
}

async function importDepart(auto){
  var list;
  try{var r=await fetch('catalogue-depart.json',{cache:'no-store'});if(!r.ok)throw 0;list=await r.json()}catch(e){return (auto||toast('Fichier catalogue-depart.json introuvable (connexion requise la première fois)','bad'));return false}
  var have={};data.produits.forEach(function(p){have[(p.nom||'').trim().toLowerCase()]=1});
  var todo=list.filter(function(x){return !have[x.nom.trim().toLowerCase()]});
  if(!todo.length){if(!auto)toast('Tous ces produits existent déjà');return true}
  toast('Importation de '+todo.length+' produits…');
  for(var i=0;i<todo.length;i++){var x=todo[i],id=uid();
    await S.put('produits',{id:id,nom:x.nom,cat:x.cat,unite:x.unite,format:x.format||'',prix:x.prix,prix_gros:0,cout:x.cout,stock:x.stock,seuil:0,code:'',paliers:[],desc:x.desc||'',archive:false,photo:x.photo||''});
    if(x.stock>0)await addMv({type:'entrée',pid:id,nom:x.nom,unite:x.unite,qte:x.stock,cout:x.cout||0,total:Math.round(x.stock*(x.cout||0)),fournisseur:'',motif:'Stock de départ'})}
  logAct('Catalogue importé',todo.length+' produits');
  toast(todo.length+' produits importés. Pensez à renseigner les codes-barres.');return true;
}
async function majPhotos(){
  if(localStorage.getItem('ne-ph-1')||data.produits.length<40)return;
  var list;try{var r=await fetch('catalogue-maj.json',{cache:'no-store'});if(!r.ok)return;list=await r.json()}catch(e){return}
  var n=0;for(var i=0;i<list.length;i++){var x=list[i];if(!x.photo)continue;var p=data.produits.find(function(q){return (q.nom||'').trim().toLowerCase()===x.nom.trim().toLowerCase()});if(p&&!p.photo){await S.put('produits',Object.assign({},p,{photo:x.photo}));n++}}
  try{localStorage.setItem('ne-ph-1','1')}catch(e){}
  if(n)toast(n+' photo(s) ajoutée(s)')
}
async function majCatalogue(){
  if(localStorage.getItem('ne-maj-1'))return;
  if(data.produits.length<40)return;
  var list;try{var r=await fetch('catalogue-maj.json',{cache:'no-store'});if(!r.ok)return;list=await r.json()}catch(e){return}
  var by={};data.produits.forEach(function(p){by[(p.nom||'').trim().toLowerCase()]=p});
  var nu=0,up=0;
  for(var i=0;i<list.length;i++){var x=list[i],k=x.nom.trim().toLowerCase(),p=by[k];
    if(p){var o=Object.assign({},p,{cat:x.cat,unite:x.unite,format:x.format,cout:x.cout,prix:x.prix,prix_gros:x.prix_gros,prix_web:x.prix_web,desc:x.desc||p.desc});await S.put('produits',o);up++}
    else{await S.put('produits',{id:'maj1-'+k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-'),nom:x.nom,cat:x.cat,unite:x.unite,format:x.format,prix:x.prix,prix_gros:x.prix_gros,prix_web:x.prix_web,cout:x.cout,stock:0,seuil:0,code:'',paliers:[],desc:x.desc||'',archive:false,photo:x.photo||''});nu++}}
  try{localStorage.setItem('ne-maj-1','1')}catch(e){}
  logAct('Catalogue mis à jour',up+' produits modifiés, '+nu+' ajoutés');toast('Catalogue mis à jour : '+up+' modifiés, '+nu+' ajoutés')
}

async function saveFile(name,content,okMsg){
  try{downloadBlob(name,content,/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json');toast(okMsg||'Fichier enregistré')}catch(e){toast('L’export a échoué','bad')}
}
function toCSV(rows){return '﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n')}
async function exportCSV(kind){
  var r=range(kind==='depenses'?ui.dper:ui.periode);
  if(kind==='depenses'){
    var ds=data.depenses.filter(function(d){return inR(d.date,r)}).sort(function(a,b){return a.date.localeCompare(b.date)});
    if(!ds.length)return toast('Aucune dépense à exporter','bad');
    return saveFile('depenses-niger-epice.csv',toCSV([['Date','Catégorie','Libellé','Bénéficiaire','Montant FCFA']].concat(ds.map(function(d){return [d.date,d.cat,d.libelle||'',d.tiers||'',d.montant]}))));
  }
  var vs=data.ventes.filter(function(v){return inR(v.date,r)}).sort(function(a,b){return a.ts-b.ts});
  if(!vs.length)return toast('Aucune vente à exporter sur cette période','bad');
  await saveFile('ventes-niger-epice.csv',toCSV([['N° facture','Date','Heure','Client','Type','Vendeur','Paiement','Articles','Total FCFA','Payé FCFA','Marge FCFA']].concat(vs.map(function(v){return [v.numero||'',v.date,fhour(v.ts),v.clientNom,v.type||'Détail',v.vendeur||'',v.mode,v.lignes.map(function(l){return l.nom+' x'+qf(l.qte)+' '+l.unite}).join(' + '),v.total,v.paye,Math.round(margeVente(v))]}))));
}

    case 'devreset':try{localStorage.removeItem('ne-device')}catch(e){}location.reload();break;
    case 'consult-off':try{['ne-device','ne-sync','ne-snap'].forEach(function(k){localStorage.removeItem(k)})}catch(e){}location.reload();break;
    case 'consult-save':{var cb=val('c-bin').trim(),ck=val('c-key').trim();if(!cb||!ck){lk.msg='Remplissez les deux champs';render();break}SYNC={bin:cb,key:ck};saveSyncCfg();location.reload();break}
    case 'consult-refresh':await consultPull(true);break;
    case 'link-setup':ui.linking=true;lk.msg='';render();break;
    case 'link-back':ui.linking=false;render();break;
    case 'link-go':{
      var cd=val('l-code').trim(),cj=null;try{cj=JSON.parse(atob(cd))}catch(e){}
      if(!cj||!cj.u||!cj.k){lk.msg='Code non valide';render();break}
      try{
        SYNC={url:cj.u,anon:cj.k,sec:cj.s||'',tag:'T'+devId.slice(-2).toUpperCase()};idb=await idbOpen();
        await opsBootstrap();
        try{localStorage.setItem('ne-device','caisse')}catch(e){}
        saveSyncCfg();location.reload();
      }catch(e){SYNC={};saveSyncCfg();lk.msg='Liaison impossible : '+(e.message||e);render()}
      break}
    case 'ops-save':{var u1=val('o-url').trim(),k1=val('o-key').trim();if(!u1||!k1)return toast('Remplissez les deux champs','bad');
      ensureSec();var firstTime=SYNC.cur==null;SYNC.url=u1;SYNC.anon=k1;SYNC.err2='';saveSyncCfg();
      try{if(firstTime){await opsActivate();opsStart();toast('Synchronisation activée')}else{await opsRest('GET','ops?limit=1&select=seq');toast('Enregistré')}opsErr=''}catch(e){opsErr=String(e.message||e);if(firstTime){delete SYNC.cur}toast('Échec : '+opsErr,'bad')}

    case 'ops-off':SYNC.url='';SYNC.anon='';delete SYNC.cur;saveSyncCfg();OUT=[];saveOut();updateChips();render();toast('Synchronisation désactivée');break;

    case 'save-fournisseur':{var fn=val('m-nom').trim();if(!fn)return toast('Indiquez le nom','bad');var fe=data.fournisseurs.find(function(x){return x.id===id}),ff=fByName(fn);if(ff&&(!fe||ff.id!==fe.id))return toast('Ce fournisseur existe déjà','bad');
      await S.put('fournisseurs',Object.assign({},fe||{},{id:id||uid(),nom:fn,tel:val('m-tel').trim(),adresse:val('m-adr').trim(),note:val('m-note').trim()}));
      if(fe&&fe.nom!==fn)for(var ia=0;ia<data.achats.length;ia++)if(data.achats[ia].fournisseurId===fe.id)await S.patch('achats',data.achats[ia].id,{fournisseurNom:fn});
      closeModal();toast('Fournisseur enregistré');break}
    case 'del-fournisseur':await S.del('fournisseurs',id);closeModal();break;
    case 'new-achat':achatModal();break;
    case 'edit-achat':achatModal(id);break;
    case 'save-achat':{var an=val('m-four').trim(),am=num(val('m-montant'));if(!an)return toast('Indiquez le fournisseur','bad');if(am<=0)return toast('Indiquez le montant','bad');
      var old=data.achats.find(function(x){return x.id===id});if(old&&am<(old.paye||0))return toast('Le montant ne peut pas être inférieur à ce qui est déjà payé','bad');
      var fo=await ensureFourn(an),rec=Object.assign({},old||{},{id:id||uid(),ts:old?old.ts:Date.now(),numero:old?old.numero:seqNext('FF'),ref:val('m-ref').trim(),fournisseurId:fo.id,fournisseurNom:fo.nom,montant:am,date:val('m-date')||today(),echeance:val('m-ech'),note:val('m-note').trim()});
      if(!old){var dj=Math.min(am,Math.max(0,num(val('m-deja'))));rec.paiements=[];rec.paye=0;if(dj>0){rec.paiements=[{id:uid(),date:rec.date,montant:dj,mode:'Espèces',note:'Payé à la réception',recu:seqNext('PF'),by:session?session.nom:''}];rec.paye=dj}}
      await S.put('achats',rec);closeModal();toast(old?'Facture modifiée':'Facture '+rec.numero+' enregistrée');break}
    case 'del-achat':{var ad=data.achats.find(function(x){return x.id===id});logAct('Facture fournisseur supprimée',ad?ad.numero+' · '+ad.fournisseurNom+' · '+money(ad.montant):'');await S.del('achats',id);closeModal();break}
    case 'achat-pay':achatPayModal(id);break;
    case 'save-achat-pay':{var aa=data.achats.find(function(x){return x.id===id}),pm=num(val('m-pmont'));if(!aa||pm<=0)return toast('Indiquez le montant','bad');var pr=await payAchat(aa,{montant:pm,date:val('m-pdate'),mode:val('m-pmode'),note:val('m-pnote').trim(),dep:chk('m-pdep')});if(!pr)return toast('Rien à payer sur cette facture','bad');achatPayModal(id,'Paiement '+pr.recu+' enregistré');break}
    case 'fpay':fpayModal(id);break;
    case 'save-fpay':{var rest=num(val('m-pmont'));if(rest<=0)return toast('Indiquez le montant','bad');var dp=val('m-pdate'),md=val('m-pmode'),dep=chk('m-pdep'),ao=data.achats.filter(function(x){return x.fournisseurId===id&&!x.annulee&&aDette(x)>0}).sort(function(x,y){return x.date.localeCompare(y.date)||x.ts-y.ts}),cnt=0;
      for(var ib=0;ib<ao.length&&rest>0;ib++){var pp=await payAchat(ao[ib],{montant:Math.min(rest,aDette(ao[ib])),date:dp,mode:md,dep:dep});if(pp){rest-=pp.montant;cnt++}}
      closeModal();toast(cnt+' paiement(s) enregistré(s)');break}
    case 'save-depense':{
      var mt2=num(val('m-montant'));if(mt2<=0)return toast('Indiquez le montant','bad');
      await S.put('depenses',{id:uid(),ts:Date.now(),date:val('m-date')||today(),cat:val('m-cat'),libelle:val('m-lib').trim(),tiers:val('m-tiers').trim(),montant:mt2,recurrent:chk('m-rec'),recu:pendingRecu||''});closeModal();toast('Dépense enregistrée');break}
    case 'del-depense':{var dd=data.depenses.find(function(x){return x.id===id});logAct('Dépense supprimée',dd?(dd.libelle||dd.cat)+' · '+money(dd.montant):'');await S.del('depenses',id);break}break;
    case 'new-commande':
      if(!data.produits.length)return toast('Ajoutez d’abord des produits','bad');
      od={clientId:'',nom:'',tel:'',adresse:'',note:'',type:'Détail',lignes:[],liv:'',acompte:0};drawOrder();break;
    case 'o-add':{
      syncOrder();var pid=val('m-prod'),qq=num(val('m-qte'));if(!pid||qq<=0)return toast('Choisissez un produit et une quantité','bad');
      var ex=od.lignes.find(function(l){return l.pid===pid});if(ex)ex.qte=r3(ex.qte+qq);else od.lignes.push({pid:pid,qte:qq});drawOrder();break}
    case 'o-rm':syncOrder();od.lignes=od.lignes.filter(function(l){return l.pid!==id});drawOrder();break;
    case 'save-commande':{
      syncOrder();if(!od.lignes.length)return toast('Ajoutez au moins un produit','bad');if(!od.nom.trim())return toast('Indiquez le nom du client','bad');
      var lignes=od.lignes.map(function(l){var p=pById(l.pid);return{pid:l.pid,nom:p.nom,cat:p.cat||'',qte:l.qte,unite:p.unite,prix:priceOf(p,od.type),cout:p.cout||0}});
      await S.put('commandes',{id:uid(),ts:Date.now(),date:today(),clientId:od.clientId,clientNom:od.nom.trim(),tel:od.tel.trim(),adresse:od.adresse.trim(),note:od.note.trim(),type:od.type,lignes:lignes,total:sumBy(lignes,function(l){return l.qte*l.prix}),livraison:od.liv||'',acompte:od.acompte||0,statut:'Nouvelle'});
      closeModal();od=null;toast('Commande enregistrée');break}
    case 'o-next':{var oo=data.commandes.find(function(x){return x.id===id});if(oo)await S.patch('commandes',id,{statut:oo.statut==='Nouvelle'?'En préparation':'Prête'});webStatusSync();break}
    case 'o-cancel':await S.patch('commandes',id,{statut:'Annulée'});webStatusSync();break;
    case 'o-del':await S.del('commandes',id);break;
    case 'o-encaisser':encaisserModal(id);break;
    case 'save-encaisser':{
      var o2=data.commandes.find(function(x){return x.id===id});if(!o2)break;
      var md=val('m-mode');if(md==='Crédit'&&!o2.clientId)return toast('Associez un client enregistré pour vendre à crédit','bad');
      var pb=stockProblem(o2.lignes);if(pb)return toast(pb,'bad');
      var s=await createSale({lignes:o2.lignes.concat(o2.frais>0?[{pid:'',nom:'Frais de livraison'+(o2.zone?' · '+o2.zone:''),cat:'',qte:1,unite:'',prix:o2.frais,cout:0,svc:true}]:[]),remise:0,mode:md,recu:num(val('m-recu'))+(o2.acompte||0),clientId:o2.clientId,source:'commande',type:o2.type});
      await S.patch('commandes',id,{statut:'Livrée',venteId:s.id});webStatusSync();closeModal();showFacture(s);break}
    case 'new-user':userModal();break;
    case 'edit-user':userModal(id);break;
    case 'save-user':{
      var un=val('m-nom').trim(),pin=val('m-pin').trim(),role=val('m-role');
      if(!un)return toast('Indiquez le nom','bad');
      var ou=id?data.utilisateurs.find(function(x){return x.id===id}):null;
      if(!ou&&!/^\d{4}$/.test(pin))return toast('Le code doit avoir 4 chiffres','bad');
      if(pin&&!/^\d{4}$/.test(pin))return toast('Le code doit avoir 4 chiffres','bad');
      var actif=ou?chk('m-actif'):true;
      var others=data.utilisateurs.filter(function(x){return x.id!==id&&x.role==='admin'&&x.actif!==false});
      if(ou&&(role!=='admin'||!actif)&&ou.role==='admin'&&!others.length)return toast('Il faut au moins un administrateur actif','bad');
      var nu=Object.assign({},ou||{},{id:id||uid(),nom:un,role:role,actif:actif});
      if(pin)nu.pin=await hashPin(pin);
      await S.put('utilisateurs',nu);closeModal();toast('Utilisateur enregistré');break}
    case 'del-user':await S.del('utilisateurs',id);closeModal();toast('Utilisateur supprimé');break;
    case 'export':await exportCSV(v);break;
    case 'backup':await backup();break;
    case 'seed':await seed();break;
    case 'import-depart':await importDepart();break;
    case 'unseed':await unseed();break;
  }
});
document.addEventListener('input',function(e){
  lastAct=Date.now();
  var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  switch(k){
    case 'lknom':lk.nom=t.value;break;
    case 'q':ui.q=t.value;var g=document.getElementById('pgrid');if(g)g.innerHTML=gridHTML();break;
    case 'pq':ui.pq=t.value;var l=document.getElementById('plist');if(l)l.innerHTML=plistHTML();break;
    case 'qty':{var c=ui.cart.find(function(x){return x.pid===t.dataset.id});if(c){c.qte=num(t.value);updateTotals()}break}
    case 'pu':{var c2=ui.cart.find(function(x){return x.pid===t.dataset.id});if(c2){c2.pu=Math.max(0,num(t.value));updateTotals()}break}
    case 'mm':ui.mm=Math.max(0,num(t.value));updateTotals();break;
    case 'pm':pmInfo();break;
    case 'rfq':rfInfo();break;
    case 'clq':clInfo();break;
    case 'prodc':prodInfo();break;
    case 'remise':ui.remise=Math.max(0,num(t.value));updateTotals();break;
    case 'recu':ui.recu=Math.max(0,num(t.value));updateTotals();break;
    case 'client':{ui.clientId=t.value;var cc=cById(t.value);if(cc&&cc.type==='Gros'&&ui.vtype!=='Gros'){ui.vtype='Gros';ui.cart.forEach(function(x){delete x.pu})}render();break}
    case 'mode':ui.mode=t.value;ui.recu=0;render();break;
    case 'rcv':rcInfo();break;
    case 'rtv':{var pr=pById(val('m-prod')),qr=num(val('m-qte'));var mo=document.getElementById('m-montant');if(pr&&mo&&qr>0)mo.value=Math.round(qr*pr.prix);break}
    case 'wa':{var a=document.getElementById('wa-link');if(a&&curFact)a.href=waHref(curFact,t.value);break}
    case 'ocl':{syncOrder();od.clientId=t.value;var cl=cById(t.value);if(cl){od.nom=cl.nom;od.tel=cl.tel||'';od.adresse=cl.adresse||'';if(cl.type==='Gros')od.type='Gros'}drawOrder();break}
    case 'otarif':syncOrder();drawOrder();break;
  }
});
document.addEventListener('change',async function(e){
  var t=e.target;if(!t||!t.files||!t.files[0])return;
  if(t.id==='r-file'){
    var f=t.files[0];t.value='';
    try{var j=JSON.parse(await f.text());if(!j||!Array.isArray(j.produits))throw 0;restoreModal(j,f.name)}catch(err){toast('Ce fichier n’est pas une sauvegarde Niger Épices','bad')}
    return;
  }
  try{
    if(t.id==='m-recu'){pendingRecu=await compressImage(t.files[0],900,0.7);document.getElementById('m-rprev').innerHTML='<img class="thumb" src="'+pendingRecu+'" alt="">'}
    if(t.id==='m-photo'){pendingPhoto=await compressImage(t.files[0],800,0.75);document.getElementById('m-prev').innerHTML='<img class="thumb" style="width:84px;height:84px" src="'+pendingPhoto+'" alt="">'}
    if(t.id==='m-logo'){pendingLogo=await compressImage(t.files[0],220,0.8);document.getElementById('m-lprev').innerHTML='<img class="thumb" style="width:84px;height:84px" src="'+pendingLogo+'" alt="">'}
  }catch(err){toast('Cette image ne peut pas être lue','bad')}
});
document.addEventListener('keydown',function(e){lastAct=Date.now();if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
document.addEventListener('touchstart',function(){lastAct=Date.now()},{passive:true});
setInterval(function(){if(session&&Date.now()-lastAct>IDLE)logout()},20000);

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!e.target||e.target.id!=='q')return;
  var c=e.target.value.trim();if(!c)return;
  var p=data.produits.find(function(x){return x.code&&x.code===c&&!x.archive});
  if(!p){ui.q='';var q0=document.getElementById('q');if(q0)q0.value='';scanUnknown(c);return}
  if(p.stock<=0){beep(false);toast(p.nom+' est en rupture','bad');return}
  var l=ui.cart.find(function(x){return x.pid===p.id});if(l)l.qte=r3(l.qte+stepOf(p));else ui.cart.push({pid:p.id,qte:stepOf(p)>=1?1:0.5});
  ui.q='';render();var q=document.getElementById('q');if(q)q.focus();beep(true);toast(p.nom+' ajouté');
});

init();
})();
</script>
